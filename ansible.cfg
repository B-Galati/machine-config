[defaults]
inventory = hosts.ini
retry_files_enabled = False
stdout_callback = debug
;log_path = ansible.log
;roles_path = .ansible/roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
callbacks_enable = timer, profile_tasks, auto_tags
callback_plugins = plugins/callbacks
interpreter_python = python
inject_facts_as_vars = True

[callback_profile_tasks]
task_output_limit = 30

[privilege_escalation]
; Ubuntu 26.04 ships sudo-rs as sudo, use the original sudo: https://www.reddit.com/r/ansible/comments/1vlmg0s/what_is_the_status_of_ansible_and_ubuntu_2604s/
become_exe = sudo.ws
