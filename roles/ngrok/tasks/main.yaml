---
- name: Add GPG key
  become: true
  shell: |
    set -euo pipefail
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | gpg --dearmor > "$tmp"
    install -D -m 0644 "$tmp" /etc/apt/keyrings/ngrok.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/ngrok.gpg

# Replaced by ngrok.sources below
- name: Remove legacy repository file
  become: true
  file:
    path: /etc/apt/sources.list.d/ngrok.list
    state: absent

- name: Add apt repository
  become: true
  deb822_repository:
    name: ngrok
    types: deb
    uris: https://ngrok-agent.s3.amazonaws.com
    suites: buster
    components: main
    signed_by: /etc/apt/keyrings/ngrok.gpg
    state: present

- name: Install
  become: true
  apt:
    update_cache: yes
    name: ngrok
