---
- name: Add GPG key to keyring
  become: true
  shell: |
    set -euo pipefail
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | gpg --dearmor > "$tmp"
    install -D -m 0644 "$tmp" /etc/apt/keyrings/google-chrome.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/google-chrome.gpg

- name: Add apt repository
  become: true
  deb822_repository:
    name: google-chrome
    types: deb
    uris: https://dl.google.com/linux/chrome/deb/
    suites: stable
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/google-chrome.gpg
    state: present

- name: Install
  become: true
  apt:
    update_cache: yes
    name: google-chrome-stable
