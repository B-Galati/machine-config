---
- name: Check for existing slack install
  command: dpkg-query -W slack-desktop
  register: slack_installed
  failed_when: false
  changed_when: false

- block:
    - name: Download and install
      become: true
      apt:
        deb: https://downloads.slack-edge.com/desktop-releases/linux/x64/4.39.95/slack-desktop-4.39.95-amd64.deb

    # Slack's daily cron adds its apt repository and key: run it now instead of waiting a day
    - name: Add Slack apt repository
      become: true
      command: /etc/cron.daily/slack

    - name: Upgrade to the latest version
      become: true
      apt:
        update_cache: yes
        name: slack-desktop
        state: latest
  when: slack_installed.rc == 1
