---
- name: Get the latest release from GitHub API
  uri:
    url: "https://api.github.com/repos/rtk-ai/rtk/releases/latest"
    return_content: yes
  register: response
  no_log: true

- name: Get version number
  set_fact:
    rtk_version: "{{ response.json | json_query('tag_name') | regex_replace('^v', '') }}"

- name: Check for existing install
  command: /usr/local/bin/rtk --version
  register: rtk_installed_version
  changed_when: rtk_version not in rtk_installed_version.stdout | default('')
  failed_when: False

- block:
    - name: Download
      get_url:
        url: https://github.com/rtk-ai/rtk/releases/download/v{{ rtk_version }}/rtk-x86_64-unknown-linux-musl.tar.gz
        dest: /tmp/rtk.tar.gz
        force: yes

    - name: Install
      become: true
      unarchive:
        src: /tmp/rtk.tar.gz
        dest: /usr/local/bin
        owner: root
        group: root
        include: [rtk]
        remote_src: yes

    - name: Verify installation
      command: /usr/local/bin/rtk gain
  when: force_install or rtk_version not in rtk_installed_version.stdout | default('')
