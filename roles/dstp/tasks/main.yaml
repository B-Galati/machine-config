---
- name: Get the latest release from GitHub API
  uri:
    url: "https://api.github.com/repos/ycd/dstp/releases/latest"
    return_content: yes
  register: response
  no_log: true

- name: Get version number
  set_fact:
    dstp_version: "{{ response.json | json_query('tag_name') | regex_replace('^v', '') }}"

- name: Download
  get_url:
    url: https://github.com/ycd/dstp/releases/download/v{{ dstp_version }}/dstp_{{ dstp_version }}_Linux_amd64.tar.gz
    dest: /tmp/dstp_{{ dstp_version }}.tar.gz
    checksum: "sha256:https://github.com/ycd/dstp/releases/download/v{{ dstp_version }}/checksums.txt"

# dstp has no --version flag: unarchive compares the archive with the installed binary instead
- name: Install
  become: true
  unarchive:
    src: /tmp/dstp_{{ dstp_version }}.tar.gz
    dest: /usr/local/bin
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_id }}'
    include: [dstp]
    remote_src: yes
