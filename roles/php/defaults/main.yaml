---
# Add a line here to install another version side-by-side.
php_versions:
  - "8.5"

# Which version `php` (the default CLI) resolves to. Must be in php_versions.
php_default_version: "8.5"

# Extensions installed for every version listed above.
# No opcache: it is built into PHP since 8.5 (no php8.5-opcache package).
php_extensions:
  - cli
  - common
  - amqp
  - curl
  - fpm
  - intl
  - mbstring
  - pgsql
  - mysql
  - redis
  - readline
  - sqlite3
  - xml
  - xdebug
  - zip
  - soap
  - apcu
