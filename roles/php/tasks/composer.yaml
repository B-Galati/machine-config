---
- name: Set php_executable variable to a default if not defined.
  set_fact:
    php_executable: php
  when: php_executable is not defined

- name: Check if Composer is installed.
  stat:
    path: ~/.local/bin/composer
  register: composer_bin

- block:
    - name: Get Composer installer signature.
      uri:
        url: https://composer.github.io/installer.sig
        return_content: true
      register: composer_installer_signature

    - name: Download Composer installer.
      get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-installer.php
        mode: 0755
        checksum: 'sha384:{{ composer_installer_signature.content }}'

    - name: Run Composer installer.
      command:
        cmd: '{{ php_executable }} composer-installer.php'
        chdir: /tmp

    - name: Move Composer.
      copy:
        remote_src: true
        src: /tmp/composer.phar
        dest: ~/.local/bin/composer
        mode: 0755
  when: not composer_bin.stat.exists

# ~/.composer if it exists, otherwise ~/.config/composer (XDG)
- name: Get Composer global bin dir
  command: ~/.local/bin/composer global config bin-dir --absolute
  register: composer_bin_dir
  changed_when: false

- name: Update PATH
  copy:
      content: |
        PATH="$PATH:{{ composer_bin_dir.stdout }}"
      dest: ~/.config/environment.d/composer.conf
      mode: 0644
