---
# ppa:ondrej/php is deprecated (no packages since 26.04), replaced by packages.sury.org
- name: Install sury.org keyring
  become: true
  apt:
    deb: https://packages.sury.org/debsuryorg-archive-keyring.deb

- name: Add sury.org PHP repository
  become: true
  deb822_repository:
    name: sury-php
    types: deb
    uris: https://packages.sury.org/php
    suites: "{{ ansible_distribution_release | lower }}"
    components: main
    signed_by: /usr/share/keyrings/debsuryorg-archive-keyring.gpg
    state: present

- name: Install PHP packages for all versions
  become: true
  apt:
    update_cache: yes
    name: "{{ php_versions | product(php_extensions) | map('join', '-') | map('regex_replace', '^', 'php') | list }}"
  # 8.3 + [cli, fpm, ...] -> [php8.3-cli, php8.3-fpm, ...]

- name: Select default PHP version via alternatives
  become: true
  alternatives:
    name: php
    path: "/usr/bin/php{{ item }}"
    link: /usr/bin/php
    priority: "{{ 100 if item == php_default_version else 50 }}"
  loop: "{{ php_versions }}"

- name: Write 99-custom.ini for each version (cli + fpm)
  become: true
  copy:
    src: php.ini
    dest: "/etc/php/{{ item.0 }}/{{ item.1 }}/conf.d/99-custom.ini"
  loop: "{{ php_versions | product(['cli', 'fpm']) | list }}"
