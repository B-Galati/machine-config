---
- name: Clone dotfiles
  git:
    repo: git@github.com:B-Galati/dotfiles
    accept_newhostkey: true
    dest: ~/dotfiles
    update: false

- name: Link dotfiles
  shell: ~/dotfiles/bootstrap.sh --force

- name: Clone docs
  git:
    repo: git@gitlab.com:B-Galati/docs.git
    accept_newhostkey: true
    dest: ~/docs
    update: false

- import_tasks: oh-my-zsh.yaml
