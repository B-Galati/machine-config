---
- name: Install deps
  become: true
  apt:
    name: libfuse2t64
    state: present

- name: Check for existing install
  stat:
    path: ~/AppImages/obsidian.AppImage
  register: obsidian_install
  changed_when: False

- block:
    # Not GitHub's latest release: it can be mobile-only, without the AppImage
    - name: Get the latest desktop release
      uri:
        url: "https://raw.githubusercontent.com/obsidianmd/obsidian-releases/master/desktop-releases.json"
        return_content: yes
      register: response
      no_log: true

    - name: Get version number
      set_fact:
        obsidian_version: "{{ (response.content | from_json).latestVersion }}"

    - name: Create AppImages directory
      file:
        path: ~/AppImages/
        state: directory
        mode: 0755

    - name: Install
      get_url:
        url: https://github.com/obsidianmd/obsidian-releases/releases/download/v{{ obsidian_version }}/Obsidian-{{ obsidian_version }}.AppImage
        dest: ~/AppImages/obsidian.AppImage
        mode: 0755
  when: not obsidian_install.stat.exists

- name: Install logo
  become: true
  copy:
    src: obsidian.png
    dest: /usr/share/pixmaps/obsidian.png

- name: Install .desktop
  copy:
    dest: ~/.local/share/applications/obsidian.desktop
    content: |
      [Desktop Entry]
      Name=Obsidian
      GenericName=Obsidian
      Comment=Second brain, notes.
      Exec={{ ansible_env.HOME }}/AppImages/obsidian.AppImage --no-sandbox
      Icon=obsidian
      StartupNotify=false
      StartupWMClass=obsidian
      Terminal=false
      Type=Application
      Categories=Utility;
  register: obsidian_desktop_file

- name: Update desktop files
  command: update-desktop-database ~/.local/share/applications -v
  when: obsidian_desktop_file.changed
