---
- name: Requirements
  become: true
  apt:
    name: '{{ packages }}'
  vars:
    packages:
      - ca-certificates
      - curl

- name: Import GPG key
  become: true
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: 0644

- name: Add Docker repository
  become: true
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release|lower }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install docker
  become: true
  apt:
    update_cache: yes
    name: '{{ packages }}'
  vars:
    packages:
      - docker-ce
      - docker-ce-cli 
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
