---
- name: Add NetBird GPG key to keyring
  become: true
  shell: |
    set -euo pipefail
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    curl -fsSL https://pkgs.netbird.io/debian/public.key | gpg --dearmor > "$tmp"
    install -D -m 0644 "$tmp" /usr/share/keyrings/netbird-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/netbird-archive-keyring.gpg

# Written by apt_repository before the switch to deb822_repository
- name: Remove legacy repository file
  become: true
  file:
    path: /etc/apt/sources.list.d/netbird.list
    state: absent

- name: Add NetBird APT repository
  become: true
  deb822_repository:
    name: netbird
    types: deb
    uris: https://pkgs.netbird.io/debian
    suites: stable
    components: main
    signed_by: /usr/share/keyrings/netbird-archive-keyring.gpg
    state: present

- name: Install NetBird
  become: true
  apt:
    update_cache: yes
    name: [netbird, netbird-ui]
    state: present
