---
- name: Add GPG key to keyring
  become: true
  shell: |
    set -euo pipefail
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    curl -fsSL https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.gpg | gpg --dearmor > "$tmp"
    install -D -m 0644 "$tmp" /usr/share/keyrings/spotify.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/spotify.gpg

- name: Add APT repository
  become: true
  deb822_repository:
    name: spotify
    types: deb
    uris: https://repository.spotify.com
    suites: stable
    components: non-free
    signed_by: /usr/share/keyrings/spotify.gpg
    state: present

# spotify-client's postinst only detects .list files and would add a duplicate spotify.list,
# unless that file already exists (documented opt-out)
- name: Prevent spotify-client from adding its own repository
  become: true
  copy:
    content: "# Repository managed in spotify.sources\n"
    dest: /etc/apt/sources.list.d/spotify.list
    mode: 0644

- name: Install
  become: true
  apt:
    update_cache: yes
    name: [spotify-client]
