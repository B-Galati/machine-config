---
- name: Add GPG key to keyring
  become: true
  shell: |
    set -euo pipefail
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    curl -fsSL https://mise.jdx.dev/gpg-key.pub | gpg --dearmor > "$tmp"
    install -D -m 0644 "$tmp" /etc/apt/keyrings/mise-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/mise-archive-keyring.gpg

- name: Add APT repository
  become: true
  deb822_repository:
    name: mise
    types: deb
    uris: https://mise.jdx.dev/deb
    suites: stable
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/mise-archive-keyring.gpg
    state: present

- name: Install
  become: true
  apt:
    update_cache: yes
    name: [mise]
    state: present
