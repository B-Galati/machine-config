---
- name: Get the latest release from GitHub API
  uri:
    url: "https://api.github.com/repos/cjpais/Handy/releases/latest"
    return_content: yes
  register: response
  no_log: true

- name: Get version number
  set_fact:
    handy_version: "{{ response.json | json_query('tag_name') | regex_replace('^v', '') }}"

- name: Check for existing install
  command: dpkg-query -W -f='${Version}' handy
  register: handy_installed_version
  changed_when: False
  failed_when: False

- name: Install
  become: true
  apt:
    deb: "https://github.com/cjpais/Handy/releases/download/v{{ handy_version }}/Handy_{{ handy_version }}_amd64.deb"
  when: handy_installed_version.stdout != handy_version

# Text input on Wayland: wtype does not work on Ubuntu 26.04, ydotool is required
# wl-clipboard: without wl-copy, Handy writes to a clipboard that native Wayland apps do not see. Also used by handy-paste
- name: Install ydotool and wl-clipboard
  become: true
  apt:
    name:
      - ydotool
      - wl-clipboard

- name: Allow ydotoold to access /dev/uinput
  become: true
  user:
    name: "{{ ansible_user_id }}"
    groups: input
    append: yes

# Starts at next login, once the input group membership is active
- name: Enable ydotool user service
  systemd_service:
    name: ydotool
    scope: user
    enabled: yes

# Handy creates or removes ~/.config/autostart/Handy.desktop from autostart_enabled on each launch
- name: Create settings directory
  file:
    path: ~/.local/share/com.pais.handy
    state: directory
    mode: 0755

- name: Check for existing settings
  stat:
    path: ~/.local/share/com.pais.handy/settings_store.json
  register: handy_settings_file

- name: Read existing settings
  slurp:
    src: ~/.local/share/com.pais.handy/settings_store.json
  register: handy_settings_content
  when: handy_settings_file.stat.exists

- name: Install paste script
  copy:
    src: handy-paste
    dest: ~/.local/bin/handy-paste
    mode: 0755

# Missing fields are filled with Handy's defaults
- name: Configure settings
  copy:
    content: "{{ ((handy_settings_content.content | b64decode | from_json) if handy_settings_file.stat.exists else {}) | combine({'settings': handy_settings}, recursive=true) | to_nice_json }}"
    dest: ~/.local/share/com.pais.handy/settings_store.json
    mode: 0644
  vars:
    handy_settings:
      autostart_enabled: true
      start_hidden: true
      # Built-in methods send physical keys: Ctrl+V types Ctrl+. on bépo, and Shift+Insert breaks while Ctrl is still held
      paste_method: external_script
      external_script_path: "{{ ansible_env.HOME }}/.local/bin/handy-paste"
      # Hold Ctrl+Space (the default binding) to dictate
      shortcut_activation: push_to_talk
      # On Wayland, the default implementation only gets shortcuts when an X11 window has focus: read evdev instead (input group)
      keyboard_implementation: handy_keys
      # GNOME has no layer shell: the overlay is a regular window that takes the focus from the app to paste into
      overlay_style: none
