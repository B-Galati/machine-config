---
- name: Check for existing install
  command: claude --version
  register: claude_code_installed
  failed_when: false
  changed_when: false

- name: Install Claude Code
  shell: curl -fsSL https://claude.ai/install.sh | bash
  when: claude_code_installed.rc != 0 or force_install

- name: Check installed version
  command: claude --version
  changed_when: false

- name: Install logo
  become: true
  copy:
    src: claude.svg
    dest: /usr/share/pixmaps/claude.svg

- name: Install notify-send
  become: true
  apt:
    name: libnotify-bin

# Hooks send notifications with -h string:desktop-entry:claude-code-cli so that GNOME groups them under this app.
# Do not add NoDisplay=true: GNOME then hides the notifications of the app
- name: Add desktop entry for notifications
  copy:
    content: |
      [Desktop Entry]
      Type=Application
      Name=Claude Code
      Icon=claude
      Exec=claude
      Terminal=true
    dest: ~/.local/share/applications/claude-code-cli.desktop
    mode: 0644

# Claude Desktop, see https://code.claude.com/docs/en/desktop-linux
# The package rewrites its key and repository on each install/upgrade: use the same paths and only create them if missing
- name: Add Claude Desktop GPG key
  become: true
  get_url:
    url: https://downloads.claude.ai/claude-desktop/key.asc
    dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
    mode: 0644

- name: Add Claude Desktop apt repository
  become: true
  copy:
    content: "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main\n"
    dest: /etc/apt/sources.list.d/claude-desktop.list
    mode: 0644
    force: no

- name: Install Claude Desktop
  become: true
  apt:
    update_cache: yes
    name: claude-desktop

# Cowork runs tasks in a QEMU/KVM VM and needs /dev/kvm and /dev/vhost-vsock (kvm group only)
- name: Allow Cowork to use KVM
  become: true
  user:
    name: "{{ ansible_user_id }}"
    groups: kvm
    append: yes

- name: Create autostart directory
  file:
    path: ~/.config/autostart
    state: directory
    mode: 0755

# Same file and content as the app's "Open at login" setting, which keeps it in sync; --startup launches in background
- name: Start Claude Desktop at login
  copy:
    content: |
      [Desktop Entry]
      Type=Application
      Name=Claude
      Exec="/usr/lib/claude-desktop/claude-desktop" --startup
      X-GNOME-Autostart-enabled=true
    dest: ~/.config/autostart/claude-desktop.desktop
    mode: 0644
