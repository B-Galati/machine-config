---
- name: Install fonts
  shell: |
    set -xe

    # Built next to the final dir, then renamed: the `creates` dir only exists once complete
    mkdir -p "{{ ansible_env.HOME }}/.local/share/fonts"
    tmp=$(mktemp -d "{{ ansible_env.HOME }}/.local/share/fonts/.{{ item }}.XXXXXX")
    trap 'rm -rf "$tmp"' EXIT
    wget -nv -O "$tmp/font.zip" "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ item }}.zip"
    unzip -o "$tmp/font.zip" -d "$tmp/unzipped"
    mkdir "$tmp/{{ item }}"
    cp "$tmp"/unzipped/*.ttf "$tmp/{{ item }}"
    mv "$tmp/{{ item }}" "{{ ansible_env.HOME }}/.local/share/fonts/{{ item }}"
  args:
    creates: '{{ ansible_env.HOME }}/.local/share/fonts/{{ item }}'
  with_items:
    - JetBrainsMono
    - Meslo
  register: install_fonts

- name: Install fonts config
  become: true
  copy:
    src: fonts.conf
    dest: /etc/fonts/local.conf

- name: Build fonts information cache files
  shell: fc-cache -rvf
  when: install_fonts.changed
